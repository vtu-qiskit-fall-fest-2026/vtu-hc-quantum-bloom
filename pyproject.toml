[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrace-quantum-bloom"
version = "0.1.0"
description = "Q-TRACE: uncertainty-aware quantum noise diagnosis, mitigation and recovery"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qtrace*"]

